# Secrets scan only (no builds, no game data): gitleaks over the full history. Same job as the Killzone 3 port's CI.
# The gitleaks release archive is checked against a pinned SHA-256 before it is unpacked; the checkout action is
# pinned to a full commit SHA (v7.0.1). SHA-256 checked 2026-10-19 against gitleaks_8.24.0_checksums.txt of the release.
name: Secrets
# Manual only until the maintainer approves automatic runs; then restore: push to main + pull_request.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

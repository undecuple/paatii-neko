# CI without the game: the exe cannot be built here (the lifted code comes from the player's own copy of the game and
# is never committed), so this checks what needs no game data: scripts parse, every patch applies to the pinned
# ps3recomp, the self-contained host tests run and the project card (.recomp.json) is checked. Only the checkout action is used, pinned to a full commit SHA (v7.0.1).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
      - name: Shell scripts parse
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - name: Python scripts compile
        run: git ls-files -z 'tools/*.py' 'port/*.py' | xargs -0 python3 -I -m py_compile
      - name: Patches apply to the pinned ps3recomp
        run: bash tools/ps3recomp-patched.sh
      - name: Host tests (fake PE files, temp repos; no game data)
        run: |
          python3 tools/release/test_stage_sdl3.py
          python3 tools/release/test_recomp_card.py
          python3 tools/release/test_release.py
          python3 tools/release/test_website.py
      - name: Project card agrees with the README and the release criteria
        run: python3 tools/release/recomp_card.py --no-sfo
      - name: Project page is up to date and loads nothing but its own files
        run: python3 tools/release/website.py --check

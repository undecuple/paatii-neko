name: Feedback or question
description: A question, a comment or an idea that is not a bug
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Questions, comments and ideas are welcome. For something that is broken use the bug report. Please do **not** attach game files, keys, firmware, decrypted binaries, saves or memory dumps.
  - type: textarea
    id: what
    attributes:
      label: Your feedback or question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Port build (if it matters)
      description: "Release number or commit."

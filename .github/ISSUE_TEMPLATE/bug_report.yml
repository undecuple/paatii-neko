name: Bug report
description: Something in the port does not work as it should
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Please do **not** attach game files, keys, firmware, decrypted binaries, saves or memory dumps: only logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Build commit
      description: "The commit (`git rev-parse --short HEAD`) of the build you ran, or the release number."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      description: "Windows version, or Linux distribution and Proton version."
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: "For example the card model and driver version."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: "Paste the relevant lines of the run's log. Before posting, remove your user name, home folder paths and any host name. Never attach game files, keys, firmware, decrypted binaries, saves or dumps."
